name: onemarketplace-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    container_name: onemarketplace-lgtm
    restart: "no"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3010}:3000"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  lgtm-data:
